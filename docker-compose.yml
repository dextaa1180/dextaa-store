services:
  postgres:
    image: postgres:16-alpine
    container_name: dextaa-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dextaa_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - dextaa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dextaa_store']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: dextaa-store-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  dextaa_postgres_data:
